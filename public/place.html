<!DOCTYPE html>
<html>
<head>
  <title>Place Details</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="place-page" id="place-model">

  <div class="place-container">
      <button class="close-page" onclick="goBack()">✖</button>
    <div class="hero">
      <img id="city-image" class="hero-img">
      <div class="hero-overlay">
        <h1 id="city-name"></h1>
        <p id="city-state"></p>
      </div>
    </div>

    <div class="info-section">
      <h2>About</h2>
      <p id="city-description"></p>

      <div class="stats">
        <div>💰 Avg Cost: <span id="city-price"></span></div>
        <div>⭐ Rating: <span id="city-rating"></span></div>
        <div>🏷 Type: <span id="city-type"></span></div>
      </div>
    </div>

    <div class="attractions">
      <h2>✨ Top Attractions</h2>

      <div class="slider-wrapper">
        <button class="slide-btn left" onclick="slideAttractions(-1)">❮</button>

        <div class="attraction-slider" id="attractionSlider">
          <!-- Cards will load here -->
        </div>

        <button class="slide-btn right" onclick="slideAttractions(1)">❯</button>
      </div>
    </div>
       

  <script>
const slug = window.location.pathname.split("/").pop();

fetch(`/api/place/${slug}`)
  .then(res => res.json())
  .then(data => {

    document.getElementById("city-name").innerText = data.name;
    document.getElementById("city-description").innerText = data.description;
    document.getElementById("city-price").innerText = "₹" + data.avgCostPerDay + "/day";
    document.getElementById("city-image").src = data.mainImage;

    const slider = document.getElementById("attractionSlider");
    slider.innerHTML = "";

    if (data.attractions) {
      data.attractions.forEach(a => {
        const card = document.createElement("div");
        card.classList.add("attraction-card");

        card.innerHTML = `
          <img src="${a.image}">
          <h4>${a.name}</h4>
          <p>${a.description}</p>
        `;

        slider.appendChild(card);
      });
    }
  });

function slideAttractions(direction) {
  const slider = document.getElementById("attractionSlider");
  slider.scrollBy({
    left: direction * 1000,
    behavior: "smooth"
  });
}
function goBack() {
  window.history.back();
}

</script>
<script src="/main.js"></script>
</body>
</html>
