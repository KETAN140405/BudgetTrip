<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Place Details</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="/main.js"></script>

  <style>
    
  </style>
</head>
<body class="place-page">
<div class="place-container">

  <button class="close-page" onclick="goBack()">✖</button>

  <!-- IMAGE GALLERY -->
  <div class="gallery-container">
    <button class="gallery-btn left" onclick="changeSlide(-1)">❮</button>
    <div class="gallery-slider" id="gallerySlider"></div>
    <button class="gallery-btn right" onclick="changeSlide(1)">❯</button>
  </div>

  <!-- HERO INFO -->
  <div class="info-section" style="padding:20px;">
    <h1 id="city-name"></h1>
    <p class="state" id="city-state"></p>
    <div class="stats">
      <div>💰 Avg Cost: <span id="city-price"></span></div>
      <div>⭐ Rating: <span id="city-rating"></span></div>
      <div>🏷 Type: <span id="city-type"></span></div>
    </div>
    <div class="quick-facts">
      <div class="fact-item"><span class="fact-icon">🌤</span><span class="fact-label">Best Time</span><span class="fact-value" id="city-besttime">—</span></div>
      <div class="fact-item"><span class="fact-icon">🌡</span><span class="fact-label">Weather</span><span class="fact-value" id="city-weather">—</span></div>
      <div class="fact-item"><span class="fact-icon">🗣</span><span class="fact-label">Language</span><span class="fact-value" id="city-language">—</span></div>
      <div class="fact-item"><span class="fact-icon">💵</span><span class="fact-label">Currency</span><span class="fact-value" id="city-currency">—</span></div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('overview',this)">📖 Overview</button>
    <button class="tab-btn" onclick="showTab('attractions',this)">✨ Attractions</button>
    <button class="tab-btn" onclick="showTab('things',this)">🎯 Things To Do</button>
    <button class="tab-btn" onclick="showTab('hotels',this)">🏨 Hotels</button>
    <button class="tab-btn" onclick="showTab('nearby',this)">📍 Nearby</button>
    <button class="tab-btn" onclick="showTab('map',this)">🗺 Map</button>
    <button class="tab-btn" onclick="showTab('reviews',this)">💬 Reviews</button>
  </div>

  <!-- TAB: OVERVIEW -->
  <div class="tab-panel active section-body" id="tab-overview">
    <!-- <h2>About</h2>
    <p id="city-description"></p> -->
    <h2>Information</h2>
    <p id="city-information"></p>
  </div>

  <!-- TAB: ATTRACTIONS -->
  <div class="tab-panel section-body" id="tab-attractions">
    <!-- <h2>✨ Top Attractions</h2> -->
    <div class="slider-wrapper">
      <button class="slide-btn left" onclick="slideAttractions(-1)">❮</button>
      <div class="attraction-slider" id="attractionSlider"></div>
      <button class="slide-btn right" onclick="slideAttractions(1)">❯</button>
    </div>
  </div>

  <!-- TAB: THINGS TO DO -->
  <div class="tab-panel section-body" id="tab-things">
    <h2>🎯 Things To Do</h2>
    <div class="things-grid" id="thingsGrid"></div>
  </div>

  <!-- TAB: HOTELS -->
  <div class="tab-panel section-body" id="tab-hotels">
    <h2>🏨 Where to Stay</h2>
    <div class="hotels-grid" id="hotelsGrid"></div>
  </div>

  <!-- TAB: NEARBY PLACES -->
  <div class="tab-panel section-body" id="tab-nearby">
    <h2>📍 Nearby Places</h2>
    <div class="nearby-slider" id="nearbySlider"></div>
  </div>

  <!-- TAB: MAP -->
  <div class="tab-panel section-body" id="tab-map">
    <h2>🗺 Map</h2>
    <div id="map" style="height:450px;border-radius:16px;"></div>
    <div class="map-legend">
      <span><span class="legend-dot" style="background:#1a73e8;"></span>City</span>
      <span><span class="legend-dot" style="background:#e53935;"></span>Attractions</span>
      <span><span class="legend-dot" style="background:#43a047;"></span>Hotels</span>
      <span><span class="legend-dot" style="background:#fb8c00;"></span>Nearby</span>
    </div>
  </div>

  <!-- TAB: REVIEWS -->
  <div class="tab-panel section-body" id="tab-reviews">
    <h2>💬 Traveller Reviews</h2>
    <div class="reviews-list" id="reviewsList"></div>
  </div>

</div>

<script>
const slug = window.location.pathname.split("/").pop();
let currentSlide = 0, slides = [], mapInitialized = false;

fetch(`/api/place/${slug}`)
  .then(res => res.json())
  .then(data => {
    window._placeData = data;

    // Basic info
    setText("city-name", data.name);
    setText("city-state", data.state);
    setText("city-description", data.description);
    setText("city-information", data.information);
    setText("city-price", data.avgCostPerDay ? "₹" + data.avgCostPerDay + "/day" : "N/A");
    setText("city-rating", data.rating || "N/A");
    setText("city-type", data.type || "Tourist Place");
    setText("city-besttime", data.bestTimeToVisit || "—");
    setText("city-weather", data.weather || "—");
    setText("city-language", data.language || "—");
    setText("city-currency", data.currency || "—");

    // Gallery
    const gallery = document.getElementById("gallerySlider");
    gallery.innerHTML = "";
    const images = (data.images && data.images.length) ? data.images : [data.mainImage];
    images.forEach((img, i) => {
      const div = document.createElement("div");
      div.className = "gallery-slide" + (i === 0 ? " active" : "");
      div.innerHTML = `<img src="${img}">`;
      gallery.appendChild(div);
    });
    slides = document.querySelectorAll(".gallery-slide");

    // Attractions
    const attrSlider = document.getElementById("attractionSlider");
    attrSlider.innerHTML = "";
    if (data.attractions && data.attractions.length) {
      data.attractions.forEach(a => {
        const card = document.createElement("div");
        card.className = "attraction-card";
        card.innerHTML = `<img src="${a.image||''}"><h4>${a.name}</h4><p>${a.description||""}</p>`;
        attrSlider.appendChild(card);
      });
    } else attrSlider.innerHTML = emptyState("No attractions listed yet.");

    // Things to do
    const thingsGrid = document.getElementById("thingsGrid");
    thingsGrid.innerHTML = "";
    if (data.thingsToDo && data.thingsToDo.length) {
      data.thingsToDo.forEach(t => {
        const price = t.price === 0 ? "Free" : (t.price ? "₹" + t.price : "");
        const card = document.createElement("div");
        card.className = "thing-card";
        card.innerHTML = `
          ${t.image ? `<img src="${t.image}">` : ""}
          <div class="thing-body">
            <h4>${t.name}</h4><p>${t.description||""}</p>
            <div class="thing-meta">
              ${t.category ? `<span class="thing-tag tag-category">${t.category}</span>` : ""}
              ${t.duration ? `<span class="thing-tag tag-duration">⏱ ${t.duration}</span>` : ""}
              ${price ? `<span class="thing-tag tag-price">${price}</span>` : ""}
            </div>
          </div>`;
        thingsGrid.appendChild(card);
      });
    } else thingsGrid.innerHTML = emptyState("No activities listed yet.");

    // Hotels
    const hotelsGrid = document.getElementById("hotelsGrid");
    hotelsGrid.innerHTML = "";
    if (data.hotels && data.hotels.length) {
      data.hotels.forEach(h => {
        const stars = h.stars ? "★".repeat(h.stars) + "☆".repeat(5 - h.stars) : "";
        const card = document.createElement("div");
        card.className = "hotel-card";
        card.innerHTML = `
          ${h.image ? `<img src="${h.image}">` : ""}
          <div class="hotel-info">
            <h4>${h.name}</h4>
            <p style="font-size:13px;color:#666;">${h.description||""}</p>
            <div class="hotel-meta">
              <span class="hotel-stars">${stars}</span>
              ${h.rating ? `<span class="hotel-rating">⭐ ${h.rating}</span>` : ""}
            </div>
            ${h.pricePerNight ? `<div class="hotel-price" style="margin-top:8px;">₹${h.pricePerNight} / night</div>` : ""}
          </div>
          ${h.link ? `<a href="${h.link}" target="_blank" class="book-btn">Book Now →</a>` : ""}`;
        hotelsGrid.appendChild(card);
      });
    } else hotelsGrid.innerHTML = emptyState("No hotel listings yet.");

    // Nearby
    const nearbySlider = document.getElementById("nearbySlider");
    nearbySlider.innerHTML = "";
    if (data.nearbyPlaces && data.nearbyPlaces.length) {
      data.nearbyPlaces.forEach(n => {
        const card = document.createElement("a");
        card.className = "nearby-card";
        card.href = n.slug ? `/place/${n.slug}` : "#";
        card.innerHTML = `
          ${n.image ? `<img src="${n.image}">` : ""}
          <div class="nearby-info">
            <h4>${n.name}</h4>
            ${n.distanceKm ? `<span class="dist-badge">📍 ${n.distanceKm} km away</span>` : ""}
            <p style="font-size:12px;color:#888;margin:6px 0 0;">${n.description||""}</p>
          </div>`;
        nearbySlider.appendChild(card);
      });
    } else nearbySlider.innerHTML = emptyState("No nearby places listed yet.");

    // Reviews
    const reviewsList = document.getElementById("reviewsList");
    reviewsList.innerHTML = "";
    if (data.reviews && data.reviews.length) {
      data.reviews.forEach(r => {
        const stars = r.rating ? "★".repeat(r.rating) + "☆".repeat(5 - r.rating) : "";
        const dateStr = r.date ? new Date(r.date).toLocaleDateString("en-IN",{year:"numeric",month:"short",day:"numeric"}) : "";
        const card = document.createElement("div");
        card.className = "review-card";
        card.innerHTML = `
          <div class="review-header">
            <span class="review-author">${r.author||"Anonymous"}</span>
            <span class="review-stars">${stars}</span>
          </div>
          <div class="review-date">${dateStr}</div>
          <div class="review-comment">${r.comment||""}</div>`;
        reviewsList.appendChild(card);
      });
    } else reviewsList.innerHTML = emptyState("No reviews yet. Be the first!");
  });

function initMap() {
  const data = window._placeData;
  if (!data || !data.lat || !data.lng) return;
  const map = L.map("map").setView([data.lat, data.lng], 12);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution:"© OpenStreetMap contributors" }).addTo(map);

  const mkr = (color) => L.divIcon({ className:"", html:`<div style="background:${color};width:13px;height:13px;border-radius:50%;border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.4);"></div>` });

  L.marker([data.lat, data.lng], { icon: mkr("#1a73e8") }).addTo(map).bindPopup(`<b>${data.name}</b>`).openPopup();

  (data.attractions||[]).forEach(a => a.lat && a.lng && L.marker([a.lat,a.lng],{icon:mkr("#e53935")}).addTo(map).bindPopup(`<b>${a.name}</b><br>${a.description||""}`));
  (data.hotels||[]).forEach(h => h.lat && h.lng && L.marker([h.lat,h.lng],{icon:mkr("#43a047")}).addTo(map).bindPopup(`<b>🏨 ${h.name}</b>${h.pricePerNight?"<br>₹"+h.pricePerNight+"/night":""}`));
  (data.nearbyPlaces||[]).forEach(n => n.lat && n.lng && L.marker([n.lat,n.lng],{icon:mkr("#fb8c00")}).addTo(map).bindPopup(`<b>${n.name}</b>${n.distanceKm?"<br>"+n.distanceKm+" km away":""}`));
}

function showTab(name, btn) {
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + name).classList.add("active");
  btn.classList.add("active");
  if (name === "map" && !mapInitialized) { initMap(); mapInitialized = true; }
}

function changeSlide(dir) {
  if (!slides.length) return;
  slides[currentSlide].classList.remove("active");
  currentSlide = (currentSlide + dir + slides.length) % slides.length;
  slides[currentSlide].classList.add("active");
}
function slideAttractions(dir) { document.getElementById("attractionSlider").scrollBy({left:dir*350,behavior:"smooth"}); }
function goBack() { window.history.back(); }
function setText(id, val) { const el = document.getElementById(id); if (el && val != null) el.innerText = val; }
function emptyState(msg) { return `<div class="empty-state">${msg}</div>`; }
</script>
</body>
</html>
