
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Place Details</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="/main.js"></script>

  <style>
    
  </style>
</head>
  <body class="place-page">

  <button class="close-page" onclick="goBack()">&#x2716;</button>

  <!-- GALLERY -->
  <div class="gallery-container" id="galleryWrap">
    <div class="gallery-hero-text">
      <div class="sub" id="city-state"></div>
      <h1 id="city-name">Loading...</h1>
    </div>
    <button class="gallery-btn left"  onclick="slide(-1)">&#10094;</button>
    <button class="gallery-btn right" onclick="slide(1)">&#10095;</button>
    <div class="gallery-dots" id="dots"></div>
  </div>

  <!-- STATS BAR -->
  <div class="stats-bar">
    <div class="stat"><div class="s-label">Avg Cost</div><div class="s-value" id="stat-price">&#8212;</div></div>
    <div class="stat"><div class="s-label">Rating</div><div class="s-value" id="stat-rating">&#8212;</div></div>
    <div class="stat"><div class="s-label">Type</div><div class="s-value" id="stat-type">&#8212;</div></div>
    <div class="stat"><div class="s-label">Hotels</div><div class="s-value" id="stat-hotels">&#8212;</div></div>
  </div>

  <!-- QUICK FACTS -->
  <div class="quick-facts" id="quickFacts"></div>

  <!-- TABS -->
  <div class="tabs-wrap">
    <div class="tabs">
      <div class="tab active" onclick="showTab('overview',this)">&#128214; Overview</div>
      <div class="tab" onclick="showTab('attractions',this)">&#10024; Attractions</div>
      <div class="tab" onclick="showTab('things',this)">&#127919; Things To Do</div>
      <div class="tab" onclick="showTab('hotels',this)">&#127968; Hotels</div>
      <div class="tab" onclick="showTab('nearby',this)">&#128205; Nearby</div>
      <div class="tab" onclick="showTab('map',this)">&#128506; Map</div>
      <div class="tab" onclick="showTab('reviews',this)">&#128172; Reviews</div>
    </div>
  </div>

  <!-- PANELS -->
  <div class="panel active" id="panel-overview">
    <h2>About</h2>
    <p id="city-description"></p>
    <h2>Information</h2>
    <p id="city-information"></p>
  </div>

  <div class="panel" id="panel-attractions">
    <h2>&#10024; Top Attractions</h2>
    <div class="attr-scroll" id="attractionSlider"></div>
  </div>

  <div class="panel" id="panel-things">
    <h2>&#127919; Things To Do</h2>
    <div class="things-grid" id="thingsGrid"></div>
  </div>

  <div class="panel" id="panel-hotels">
    <h2>&#127968; Where to Stay</h2>
    <div class="hotels-grid" id="hotelsGrid"></div>
  </div>

  <div class="panel" id="panel-nearby">
    <h2>&#128205; Nearby Places</h2>
    <div class="nearby-slider" id="nearbySlider"></div>
  </div>

  <div class="panel" id="panel-map">
    <h2>&#128506; Map</h2>
    <div id="map"></div>
    <div class="map-legend">
      <span><span class="ldot" style="background:#e8651a"></span>City</span>
      <span><span class="ldot" style="background:#e53935"></span>Attractions</span>
      <span><span class="ldot" style="background:#43a047"></span>Hotels</span>
      <span><span class="ldot" style="background:#1a73e8"></span>Nearby</span>
    </div>
  </div>

  <div class="panel" id="panel-reviews">
    <h2>&#128172; Traveller Reviews</h2>
    <div class="reviews-list" id="reviewsList"></div>
  </div>

<script>
const slug = window.location.pathname.split('/').pop();
let cur = 0, slides = [], mapReady = false;

fetch('/api/place/' + slug)
  .then(r => r.json())
  .then(loadData)
  .catch(() => loadData(DEMO));

// ── RENDER 
function loadData(data) {
  window._d = data;

  // Text
  setT('city-name',        data.name || '');
  setT('city-state',       data.state ? data.state + ', India' : '');
  setT('city-description', data.description || '');
  setT('city-information', data.information || '');
  setT('stat-price',       data.avgCostPerDay ? '&#8377;' + data.avgCostPerDay + '/day' : 'N/A');
  setT('stat-rating',      data.rating ? '&#11088; ' + data.rating : 'N/A');
  setT('stat-type',        data.type || 'Tourist Place');
  setT('stat-hotels',      data.hotels && data.hotels.length ? data.hotels.length + ' Listed' : '0');

  // Quick facts
  const qf = document.getElementById('quickFacts');
  qf.innerHTML = '';
  [ ['&#127780;','Best Time',   data.bestTimeToVisit],
    ['&#127777;','Weather',     data.weather],
    ['&#128483;','Language',    data.language],
    ['&#128181;','Currency',    data.currency]
  ].forEach(([ico, lbl, val]) => {
    if (!val) return;
    qf.innerHTML += '<div class="fact"><span class="icon">' + ico + '</span><div class="fl"><span>' + lbl + '</span><strong>' + val + '</strong></div></div>';
  });

  // Gallery
  const wrap = document.getElementById('galleryWrap');
  wrap.querySelectorAll('.gallery-slide').forEach(s => s.remove());
  const imgs = data.images && data.images.length ? data.images : [data.mainImage];
  const hero = wrap.querySelector('.gallery-hero-text');
  imgs.forEach((src, i) => {
    const d = document.createElement('div');
    d.className = 'gallery-slide' + (i === 0 ? ' active' : '');
    d.innerHTML = '<img src="' + src + '" alt="' + (data.name||'') + '"><div class="gallery-overlay"></div>';
    wrap.insertBefore(d, hero);
  });
  slides = wrap.querySelectorAll('.gallery-slide');
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = '';
  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'gdot' + (i === 0 ? ' active' : '');
    d.onclick = () => goTo(i);
    dotsEl.appendChild(d);
  });

  // Attractions
  const atEl = document.getElementById('attractionSlider');
  atEl.innerHTML = '';
  const atArr = data.attractions || [];
  if (atArr.length) {
    atArr.forEach(a => {
      atEl.innerHTML += '<div class="attr-card">' + (a.image ? '<img src="' + a.image + '">' : '') + '<div class="ac-body"><h4>' + a.name + '</h4><p>' + (a.description||'') + '</p></div></div>';
    });
  } else atEl.innerHTML = empt('No attractions listed yet.');

  // Things
  const thEl = document.getElementById('thingsGrid');
  thEl.innerHTML = '';
  const thArr = data.thingsToDo || [];
  if (thArr.length) {
    thArr.forEach(t => {
      const pt = t.price === 0 ? '<span class="tag tag-free">Free</span>' : (t.price ? '<span class="tag tag-price">&#8377;' + t.price + '</span>' : '');
      thEl.innerHTML += '<div class="thing-card">' + (t.image ? '<img src="' + t.image + '">' : '') +
        '<div class="thing-body"><h4>' + t.name + '</h4><p>' + (t.description||'') + '</p>' +
        '<div class="tags">' + (t.category ? '<span class="tag tag-cat">' + t.category + '</span>' : '') +
        (t.duration ? '<span class="tag tag-dur">&#9200; ' + t.duration + '</span>' : '') + pt + '</div></div></div>';
    });
  } else thEl.innerHTML = empt('No activities listed yet.');

  // Hotels
  const htEl = document.getElementById('hotelsGrid');
  htEl.innerHTML = '';
  const htArr = data.hotels || [];
  if (htArr.length) {
    htArr.forEach(h => {
      const st = h.stars ? '&#9733;'.repeat(h.stars) + '&#9734;'.repeat(5 - h.stars) : '';
      htEl.innerHTML += '<div class="hotel-card">' + (h.image ? '<img src="' + h.image + '">' : '') +
        '<div class="hotel-info"><h4>' + h.name + '</h4><div class="hdesc">' + (h.description||'') + '</div>' +
        '<div class="hotel-meta"><span class="hotel-stars">' + st + '</span>' + (h.rating ? '<span class="hotel-badge">&#11088; ' + h.rating + '</span>' : '') + '</div>' +
        (h.pricePerNight ? '<div class="hotel-price">&#8377;' + h.pricePerNight + ' / night</div>' : '') + '</div>' +
        (h.link ? '<a href="' + h.link + '" target="_blank" class="book-btn">Book Now &#8594;</a>' : '') + '</div>';
    });
  } else htEl.innerHTML = empt('No hotel listings yet.');

  // Nearby
  const nbEl = document.getElementById('nearbySlider');
  nbEl.innerHTML = '';
  const nbArr = data.nearbyPlaces || [];
  if (nbArr.length) {
    nbArr.forEach(n => {
      nbEl.innerHTML += '<a class="nearby-card" href="' + (n.slug ? '/place/' + n.slug : '#') + '">' +
        (n.image ? '<img src="' + n.image + '">' : '') +
        '<div class="nearby-info"><h4>' + n.name + '</h4>' +
        (n.distanceKm ? '<span class="dist">&#128205; ' + n.distanceKm + ' km</span>' : '') +
        '<p>' + (n.description||'') + '</p></div></a>';
    });
  } else nbEl.innerHTML = empt('No nearby places listed yet.');

  // Reviews
  const rvEl = document.getElementById('reviewsList');
  rvEl.innerHTML = '';
  const rvArr = data.reviews || [];
  if (rvArr.length) {
    rvArr.forEach(r => {
      const st = r.rating ? '&#9733;'.repeat(r.rating) + '&#9734;'.repeat(5 - r.rating) : '';
      const dt = r.date ? new Date(r.date).toLocaleDateString('en-IN', {year:'numeric',month:'long',day:'numeric'}) : '';
      rvEl.innerHTML += '<div class="review-card"><div class="rh"><span class="rauthor">' + (r.author||'Anonymous') + '</span><span class="rstars">' + st + '</span></div><div class="rdate">' + dt + '</div><div class="rcomment">' + (r.comment||'') + '</div></div>';
    });
  } else rvEl.innerHTML = empt('No reviews yet. Be the first!');
}

// ── GALLERY ──
function goTo(n) {
  if (!slides.length) return;
  slides[cur].classList.remove('active');
  document.querySelectorAll('.gdot')[cur] && document.querySelectorAll('.gdot')[cur].classList.remove('active');
  cur = (n + slides.length) % slides.length;
  slides[cur].classList.add('active');
  document.querySelectorAll('.gdot')[cur] && document.querySelectorAll('.gdot')[cur].classList.add('active');
}
function slide(d) { goTo(cur + d); }
setInterval(() => slide(1), 4500);

// ── TABS ──
function showTab(name, el) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'map' && !mapReady) { initMap(); mapReady = true; }
}

// ── MAP ──
function initMap() {
  const d = window._d;
  if (!d || !d.lat || !d.lng) return;
  const map = L.map('map').setView([d.lat, d.lng], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(map);
  const mk = (c, s) => L.divIcon({ className: '', html: '<div style="background:' + c + ';width:' + s + 'px;height:' + s + 'px;border-radius:50%;border:2.5px solid white;box-shadow:0 2px 8px rgba(0,0,0,.4)"></div>' });
  L.marker([d.lat, d.lng], { icon: mk('#e8651a', 16) }).addTo(map).bindPopup('<b>' + d.name + '</b>').openPopup();
  (d.attractions||[]).forEach(a => a.lat && a.lng && L.marker([a.lat,a.lng],{icon:mk('#e53935',13)}).addTo(map).bindPopup('<b>'+a.name+'</b>'));
  (d.hotels||[]).forEach(h => h.lat && h.lng && L.marker([h.lat,h.lng],{icon:mk('#43a047',13)}).addTo(map).bindPopup('<b>'+h.name+'</b>'));
  (d.nearbyPlaces||[]).forEach(n => n.lat && n.lng && L.marker([n.lat,n.lng],{icon:mk('#1a73e8',13)}).addTo(map).bindPopup('<b>'+n.name+'</b>'));
}

// ── HELPERS ──
function setT(id, val) { const e = document.getElementById(id); if (e) e.innerHTML = val || ''; }
function empt(msg) { return '<div class="empty-state">' + msg + '</div>'; }
function goBack() { window.history.back(); }
</script>
</body>
</html>
