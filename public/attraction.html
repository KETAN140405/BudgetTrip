<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Attraction — BudgetTrip AI</title>
<link rel="stylesheet" href="/style.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg1, #0f0e0c);
    color: var(--text1, #fff);
    min-height: 100vh;
  }

  /* ── LOADING ── */
  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 16px;
  }
  .spin {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,255,255,0.1);
    border-top-color: #C4521A;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { font-size: 13px; color: rgba(255,255,255,0.4); }

  /* ── BACK BAR ── */
  .back-bar {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(15,14,12,0.9);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    padding: 14px 40px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .back-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    font-size: 14px;
    font-family: 'Outfit', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0;
    transition: color 0.2s;
  }
  .back-btn:hover { color: #C4521A; }
  .back-bar-title {
    margin-left: auto;
    font-size: 14px;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    font-family: 'Playfair Display', serif;
    font-style: italic;
  }

  /* ── HERO IMAGE ── */
  .hero {
    height: 70vh;
    min-height: 420px;
    position: relative;
    overflow: hidden;
  }
  .hero-img {
    width: 100%; height: 100%;
    object-fit: cover;
    filter: brightness(0.55);
    animation: zoom 14s ease-out forwards;
  }
  @keyframes zoom { from { transform: scale(1.06); } to { transform: scale(1); } }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      transparent 40%,
      rgba(10,8,5,0.95) 100%
    );
  }

  .hero-content {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 48px 56px;
  }
  .hero-city {
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #C4521A;
    font-weight: 600;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hero-city::before { content: ''; width: 24px; height: 1.5px; background: #C4521A; }
  .hero-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(40px, 7vw, 90px);
    font-weight: 900;
    color: #fff;
    line-height: 0.95;
    letter-spacing: -0.02em;
  }

  /* ── INFO BODY ── */
  .info-body {
    max-width: 860px;
    margin: 0 auto;
    padding: 64px 40px 80px;
  }

  /* description */
  .desc-label {
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #C4521A;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .desc-label::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }

  .desc-text {
    font-size: clamp(16px, 2vw, 20px);
    line-height: 1.85;
    color: rgba(255,255,255,0.65);
    margin-bottom: 56px;
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
  }

  /* info cards row */
  .info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 56px;
  }
  .info-tile {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    padding: 20px 20px;
  }
  .info-tile-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .info-tile-val {
    font-size: 16px;
    font-weight: 500;
    color: #fff;
  }

  /* map placeholder */
  .map-section { margin-bottom: 56px; }
  .map-label {
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: #C4521A;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .map-label::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
  #att-map {
    height: 320px;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.03);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.2);
    font-size: 14px;
  }

  /* back to city button */
  .back-city-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #C4521A;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 16px 32px;
    font-size: 15px;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s, transform 0.15s;
  }
  .back-city-btn:hover { background: #E8703A; transform: translateY(-2px); }

  /* error */
  #errWrap {
    display: none;
    text-align: center;
    padding: 100px 24px;
  }
  #errWrap h2 {
    font-family: 'Playfair Display', serif;
    font-size: 36px; margin-bottom: 12px;
  }
  #errWrap p { color: rgba(255,255,255,0.4); margin-bottom: 28px; }

  @media (max-width: 640px) {
    .back-bar { padding: 12px 20px; }
    .hero-content { padding: 32px 24px; }
    .info-body { padding: 40px 20px 60px; }
    .info-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading">
  <div class="spin"></div>
  <p>Loading attraction...</p>
</div>

<!-- PAGE -->
<div id="page" style="display:none">

  <!-- BACK BAR -->
  <div class="back-bar">
    <button class="back-btn" onclick="history.back()">← Back</button>
    <span class="back-bar-title" id="barTitle"></span>
  </div>

  <!-- HERO -->
  <div class="hero">
    <img class="hero-img" id="aImg" src="" alt="">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="hero-city" id="aCity"></div>
      <h1 class="hero-name" id="aName"></h1>
    </div>
  </div>

  <!-- INFO BODY -->
  <div class="info-body">

    <div class="desc-label">About This Attraction</div>
    <p class="desc-text" id="aDesc"></p>

    <!-- Quick info tiles -->
    <div class="info-grid">
      <div class="info-tile">
        <div class="info-tile-label">City</div>
        <div class="info-tile-val" id="iCity">—</div>
      </div>
      <div class="info-tile">
        <div class="info-tile-label">Latitude</div>
        <div class="info-tile-val" id="iLat">—</div>
      </div>
      <div class="info-tile">
        <div class="info-tile-label">Longitude</div>
        <div class="info-tile-val" id="iLng">—</div>
      </div>
    </div>

    <!-- Map -->
    <div class="map-section" id="mapSection" style="display:none">
      <div class="map-label">Location</div>
      <div id="att-map"></div>
    </div>

    <!-- Back to city -->
    <a class="back-city-btn" id="backCityBtn" href="#">
      ← Explore More in <span id="backCityName"></span>
    </a>

  </div>
</div>

<!-- ERROR -->
<div id="errWrap">
  <h2>Attraction Not Found</h2>
  <p>We couldn't find this attraction.</p>
  <a class="back-city-btn" href="/">← Back to Home</a>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
/* get ID from URL: /attraction/6638abc123 */
function getId() {
  const parts = window.location.pathname.split('/').filter(Boolean);
  return parts[parts.length - 1] || '';
}

function render(d) {
  document.title = `${d.name} — BudgetTrip AI`;

  /* back bar */
  document.getElementById('barTitle').textContent = d.name || '';

  /* hero */
  document.getElementById('aImg').src = d.image || d.img || '';
  document.getElementById('aImg').alt = d.name || '';
  document.getElementById('aCity').textContent = d.cityName || '';
  document.getElementById('aName').textContent = d.name || '';

  /* description */
  document.getElementById('aDesc').textContent =
    d.description || 'No description available for this attraction.';

  /* tiles */
  document.getElementById('iCity').textContent = d.cityName || '—';
  document.getElementById('iLat').textContent  = d.lat ? d.lat.toFixed(4) : '—';
  document.getElementById('iLng').textContent  = d.lng ? d.lng.toFixed(4) : '—';

  /* back to city button */
  const slug = d.citySlug || '';
  document.getElementById('backCityBtn').href = `/place/${slug}`;
  document.getElementById('backCityName').textContent = d.cityName || 'City';

  /* map — only if lat/lng exist */
  if (d.lat && d.lng) {
    document.getElementById('mapSection').style.display = 'block';
    setTimeout(() => {
      const map = L.map('att-map').setView([d.lat, d.lng], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);
      L.marker([d.lat, d.lng])
        .addTo(map)
        .bindPopup(`<b>${d.name}</b>`)
        .openPopup();
    }, 100);
  }

  /* show page */
  document.getElementById('loading').style.display = 'none';
  document.getElementById('page').style.display = 'block';
}

function showError() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('errWrap').style.display = 'block';
}

async function load() {
  const id = getId();
  if (!id) return showError();
  try {
    const res  = await fetch(`/api/attraction/${id}`);
    if (!res.ok) throw new Error('Not found');
    const data = await res.json();
    render(data);
  } catch (e) {
    console.error(e);
    showError();
  }
}

load();
</script>
</body>
</html>
